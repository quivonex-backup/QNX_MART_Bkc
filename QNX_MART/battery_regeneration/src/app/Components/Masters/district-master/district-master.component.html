<div class="container">

  <h2>District Master</h2>

  <form [formGroup]="districtForm" (ngSubmit)="onSubmit()">


    <div class="form-group">
      <label>Select State</label>
      <select formControlName="state" class="form-control">
        <option value="">-- Select State --</option>
        <option *ngFor="let state of states" [value]="state.id">
          {{ state.state_name }}
        </option>
      </select>
    </div>


    <div class="form-group">
      <label>District Name</label>
      <input type="text" formControlName="district_name" class="form-control" />
    </div>



    <div class="form-check">
      <input type="checkbox" formControlName="is_active" />
      <label>Is Active</label>
    </div>

    <!-- <div class="form-check">
      <input type="checkbox" formControlName="flag" />
      <label>Flag</label>
    </div> -->

    <button type="submit" class="btn btn-primary mt-2">
      Save District
    </button>

  </form>

  <hr>

  <h3>District List</h3>

  <table class="table table-bordered mt-2">
    <thead>
      <tr>
        <th>ID</th>
        <th>District</th>
        <th>State</th>
        <th>Active</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let district of districts">
        <td>{{ district.id }}</td>
        <td>{{ district.district_name }}</td>
        <td>{{ district.state }}</td>
        <td>{{ district.is_active ? 'Yes' : 'No' }}</td>
      </tr>
    </tbody>
  </table>

</div>
