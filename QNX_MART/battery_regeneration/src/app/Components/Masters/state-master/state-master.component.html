<div class="container-fluid mt-4">
  <div class="row">

    <!-- LEFT SIDE FORM -->
    <div class="col-12 col-md-4 col-lg-3 mb-4">
      <div class="card p-3 shadow-sm">
        <h5>{{ isEditMode ? 'Update State' : 'Create State' }}</h5>

        <form [formGroup]="stateForm" (ngSubmit)="onSubmit()">

          <div class="mb-3">
            <label class="form-label">State Code</label>
            <input type="text" class="form-control" formControlName="state_code">
          </div>

          <div class="mb-3">
            <label class="form-label">State Name</label>
            <input type="text" class="form-control" formControlName="state_name">
          </div>

          <button type="submit" class="btn btn-primary w-100">
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>

          <button *ngIf="isEditMode"
                  type="button"
                  class="btn btn-secondary w-100 mt-2"
                  (click)="resetForm()">
            Cancel
          </button>

        </form>
      </div>
    </div>

    <!-- RIGHT SIDE TABLE -->
    <div class="col-12 col-md-8 col-lg-9">
      <div class="card p-3 shadow-sm">
        <h5>State List</h5>

        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>State Code</th>
                <th>State Name</th>
                <th>Active</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let state of states"
                  (click)="editState(state)"
                  style="cursor: pointer">

                <td>{{ state.id }}</td>
                <td>{{ state.state_code }}</td>
                <td>{{ state.state_name }}</td>
                <td>
                  <span class="badge bg-success" *ngIf="state.is_active">Yes</span>
                  <span class="badge bg-danger" *ngIf="!state.is_active">No</span>
                </td>

                <td (click)="$event.stopPropagation()">
                  <button class="btn btn-sm btn-warning me-2"
                          (click)="editState(state)">
                    Edit
                  </button>

                  <button class="btn btn-sm btn-danger"
                          (click)="deleteState(state.id)">
                    Delete
                  </button>
                </td>

              </tr>
            </tbody>

          </table>
        </div>

      </div>
    </div>

  </div>
</div>
